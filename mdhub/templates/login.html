<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkdownHub</title>
  <link rel="stylesheet" href="/static/css/mdhub.css">
  <script src="/static/js/theme-boot.js"></script>
</head>
<body>
  <div class="topbar">
    <span class="brand"><a href="/">MarkdownHub</a></span>
    <span class="spacer"></span>
    <label style="font-size:12px;color:var(--muted)">样式
      <select id="theme-select"></select>
    </label>
  </div>
  <div class="container login-container">
    <div class="login-card">
      <div class="login-lock">🔒</div>
      <h1>请登录</h1>
      <p class="login-sub">登录后可查看和管理已共享的 Markdown 文档</p>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="用户名" autocomplete="username">
        <input type="password" id="login-password" placeholder="密码" autocomplete="current-password">
        <button type="submit">登录</button>
        <span id="login-error" class="missing"></span>
      </form>
    </div>
  </div>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
