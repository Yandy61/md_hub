<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkdownHub</title>
  <link rel="stylesheet" href="/static/css/mdhub.css">
  <script src="/static/js/theme-boot.js"></script>
</head>
<body>
  <div class="topbar">
    <span class="brand"><a href="/">MarkdownHub</a></span>
    <span class="spacer"></span>
    <input type="search" id="filter" placeholder="按文件名过滤…" autocomplete="off">
    <label style="font-size:12px;color:var(--muted)">样式
      <select id="theme-select"></select>
    </label>
    <div id="admin-box">
      <form id="entry-form" style="display:inline">
        <input type="text" id="entry-path" placeholder="输入绝对路径（支持 ~）：如 ~/data/xxx.md 或目录" size="34">
        <button type="submit">添加索引</button>
      </form>
      <button id="browse-btn">浏览目录</button>
      <form id="file-form" style="display:inline">
        <input type="text" id="file-name" placeholder="新建文件名（如 notes/xx.md）" size="22">
        <button type="submit">新建文件</button>
        <span id="entry-msg"></span>
      </form>
      <button id="logout-btn">登出</button>
    </div>
  </div>
  <div class="container" id="entries"></div>

  <div id="browse-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">选择目录或文件</span>
        <button id="browse-close" class="modal-close">✕</button>
      </div>
      <div class="modal-path" id="browse-current">—</div>
      <div class="modal-actions">
        <button id="browse-up">返回上级</button>
        <button id="browse-root">回根目录</button>
        <button id="browse-choose-dir">选此目录</button>
      </div>
      <div class="modal-list" id="browse-list"></div>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/admin.js"></script>
  <script src="/static/js/browse.js"></script>
  <script src="/static/js/list.js"></script>
</body>
</html>
