<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkdownHub</title>
  <link rel="stylesheet" href="/static/css/mdhub.css">
</head>
<body>
  <div class="topbar">
    <span class="brand"><a href="/">MarkdownHub</a></span>
    <input type="search" id="filter" placeholder="按文件名过滤…" autocomplete="off">
    <div id="admin-box">
      <form id="login-form" hidden>
        <input type="text" id="login-username" placeholder="用户名" size="8">
        <input type="password" id="login-password" placeholder="密码" size="8">
        <button type="submit">登录</button>
        <span id="login-error" class="missing"></span>
      </form>
      <div id="admin-actions" hidden>
        <form id="entry-form" style="display:inline">
          <input type="text" id="entry-path" placeholder="输入文件或目录的绝对路径" size="30">
          <button type="submit">添加索引</button>
        </form>
        <form id="file-form" style="display:inline">
          <input type="text" id="file-name" placeholder="新建文件名（如 notes/xx.md）" size="24">
          <button type="submit">新建文件</button>
          <span id="entry-msg"></span>
        </form>
        <button id="logout-btn">登出</button>
      </div>
    </div>
  </div>
  <div class="container" id="entries"></div>
  <script src="/static/js/list.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
