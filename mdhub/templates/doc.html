<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkdownHub</title>
  <link rel="stylesheet" href="/static/css/mdhub.css">
  <link rel="stylesheet" id="hljs-css" href="/static/vendor/hljs-github.css">
  <link rel="stylesheet" href="/static/vendor/katex.min.css">
  <link rel="stylesheet" href="/static/vendor/codemirror.css">
  <link rel="stylesheet" id="cm-theme-css" href="/static/vendor/cm-material-darker.css" disabled>
  <script src="/static/js/theme-boot.js"></script>
</head>
<body data-scheme="light">
  <div class="topbar">
    <span class="brand"><a href="/">MarkdownHub</a></span>
    <span class="doc-path" id="doc-path"></span>
    <span class="spacer"></span>
    <span class="zoom-ctrl" title="缩放文档字号">
      <button id="zoom-out" title="缩小">−</button>
      <span id="zoom-level" title="点击重置 100%">100%</span>
      <button id="zoom-in" title="放大">＋</button>
    </span>
    <label style="font-size:12px;color:var(--muted)">样式
      <select id="theme-select"></select>
    </label>
  </div>
  <div class="doc-container">
    <div id="edit-bar" hidden>
      <button id="edit-btn">编辑</button>
      <span id="edit-actions" hidden>
        <button id="save-btn">保存</button>
        <button id="cancel-btn">取消</button>
      </span>
      <span class="doc-path">保存将直接写回原文件（自动备份）</span>
    </div>
    <div id="doc-body">加载中…</div>
    <div id="editor-wrap" hidden></div>
  </div>
  <script src="/static/vendor/markdown-it.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/katex.min.js"></script>
  <script src="/static/vendor/auto-render.min.js"></script>
  <script src="/static/vendor/mermaid.min.js"></script>
  <script src="/static/vendor/codemirror.js"></script>
  <script src="/static/vendor/xml-mode.js"></script>
  <script src="/static/vendor/javascript-mode.js"></script>
  <script src="/static/vendor/css-mode.js"></script>
  <script src="/static/vendor/markdown-mode.js"></script>
  <script src="/static/js/render.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/zoom.js"></script>
  <script src="/static/js/editor.js"></script>
  <script src="/static/js/doc.js"></script>
</body>
</html>
